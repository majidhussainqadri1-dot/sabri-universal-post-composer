name: File 22 Authorization Forensic 0.1.1

on:
  pull_request:
    branches:
      - main
    paths:
      - 'sabri-universal-post-composer.php'
      - 'includes/core/class-permission-resolver.php'
      - 'includes/core/class-plugin.php'
      - 'includes/admin/class-system-check-page.php'
      - 'tests/CompleteAuthorizationForensicTest.php'
      - 'tests/FounderAdminCreateSurfaceRegressionTest.php'
      - 'tests/TwelfthCompleteReviewTest.php'
      - 'tests/fixtures/sabri-membership-core/**'
      - 'readme.txt'
      - 'docs/FILE22-AUTHORIZATION-FORENSIC-0.1.1.md'
      - '.distignore'
      - '.github/workflows/file22-authorization-forensic-0.1.1.yml'
  push:
    branches:
      - main
    paths:
      - 'sabri-universal-post-composer.php'
      - 'includes/core/class-permission-resolver.php'
      - 'includes/core/class-plugin.php'
      - 'includes/admin/class-system-check-page.php'
      - 'tests/CompleteAuthorizationForensicTest.php'
      - 'tests/FounderAdminCreateSurfaceRegressionTest.php'
      - 'tests/TwelfthCompleteReviewTest.php'
      - 'tests/fixtures/sabri-membership-core/**'
      - 'readme.txt'
      - 'docs/FILE22-AUTHORIZATION-FORENSIC-0.1.1.md'
      - '.distignore'
      - '.github/workflows/file22-authorization-forensic-0.1.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Complete authorization QA and package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --quiet

      - name: Run cumulative tests and static analysis
        run: |
          set -euo pipefail
          composer test
          composer phpstan
          composer phpcs

      - name: Verify release and companion contracts
        run: |
          set -euo pipefail
          grep -F 'Version:     0.1.1' sabri-universal-post-composer.php
          grep -F "SUPC_VERSION', '0.1.1" sabri-universal-post-composer.php
          grep -F "SUPC_MIN_SMC_VERSION', '1.2.2" sabri-universal-post-composer.php
          grep -F "SUPC_MIN_SMC_DB_VERSION', '1.2.0" sabri-universal-post-composer.php
          grep -F "SUPC_MIN_SMC_CONTRACT_VERSION', '1.1.1" sabri-universal-post-composer.php
          grep -F "private const STATE_CALLBACK      = 'smc_membership_state'" includes/core/class-permission-resolver.php
          grep -F "'key'    => 'current_user_authorization'" includes/core/class-plugin.php
          grep -F 'Audit every independent authorization gate in one pass' includes/core/class-plugin.php
          grep -F 'file21_duplicate_installed_copies' includes/core/class-plugin.php
          grep -F 'file21_composer_disabled' includes/core/class-plugin.php
          grep -F 'file21_emergency_disabled' includes/core/class-plugin.php
          grep -F 'native_adapter_create_denied' includes/core/class-plugin.php

      - name: Build deterministic production package
        shell: bash
        run: |
          set -euo pipefail
          package='22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC'
          stage="$RUNNER_TEMP/file22-stage"
          root="$stage/sabri-universal-post-composer"
          rm -rf "$stage" release
          mkdir -p "$root" release
          rsync -a --delete --exclude-from=.distignore ./ "$root/"
          find "$root" -type l -print -quit | grep -q . && { echo 'Symlink found in package'; exit 1; } || true
          find "$root" -type f \( -name '*.log' -o -name '*.zip' -o -name '.env' \) -print -quit | grep -q . && { echo 'Forbidden file found in package'; exit 1; } || true
          find "$root" -type f -print0 | sort -z | xargs -0 sha256sum | sed "s#  $stage/##" > "release/${package}-MANIFEST.sha256"
          (cd "$stage" && find sabri-universal-post-composer -exec touch -h -t 202608010000.00 {} + && zip -X -9 -r "$GITHUB_WORKSPACE/release/${package}.zip" sabri-universal-post-composer >/dev/null)
          (cd release && sha256sum "${package}.zip" > "${package}.sha256")
          cat > "release/${package}-TEST-REPORT.md" <<REPORT
          # File 22 0.1.1 Authorization Forensic Release

          - Exact source head: $GITHUB_SHA
          - PHPUnit: PASS
          - PHPStan: PASS
          - WordPress Coding Standards: PASS
          - File 00 minimum plugin: 1.2.2
          - File 00 minimum database schema: 1.2.0
          - File 00 minimum contract: 1.1.1
          - Aggregate current-user authorization diagnostic: PRESENT
          - Production deployed: 0
          REPORT

      - name: Verify package content and checksum
        shell: bash
        run: |
          set -euo pipefail
          package='22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC'
          (cd release && sha256sum -c "${package}.sha256")
          unzip -t "release/${package}.zip"
          unzip -p "release/${package}.zip" 'sabri-universal-post-composer/sabri-universal-post-composer.php' | grep -F 'Version:     0.1.1'
          unzip -p "release/${package}.zip" 'sabri-universal-post-composer/includes/core/class-plugin.php' | grep -F 'current_user_authorization'
          unzip -p "release/${package}.zip" 'sabri-universal-post-composer/includes/core/class-permission-resolver.php' | grep -F 'smc_membership_state'
          ! unzip -l "release/${package}.zip" | grep -E '/(tests|vendor|\.github)/'

      - name: Upload verified File 22 package
        uses: actions/upload-artifact@v4
        with:
          name: file22-0.1.1-authorization-forensic-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC.zip
            release/22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC.sha256
            release/22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC-MANIFEST.sha256
            release/22-sabri-universal-post-composer-0.1.1-AUTHORIZATION-FORENSIC-TEST-REPORT.md
