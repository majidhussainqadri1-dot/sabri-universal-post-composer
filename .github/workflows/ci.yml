name: File 22 CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-22-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No PHP files found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

  phpcs:
    name: WordPress security standards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist --quiet
      - run: composer phpcs

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist --quiet
      - name: Analyze and capture diagnostics
        id: analyze
        shell: bash
        run: |
          set +e
          vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --error-format=json --no-progress > phpstan-result.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat phpstan-result.json
          exit 0
      - name: Upload PHPStan diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phpstan-result
          path: phpstan-result.json
          if-no-files-found: error
          retention-days: 3
      - name: Enforce PHPStan result
        shell: bash
        run: test "${{ steps.analyze.outputs.status }}" = "0"

  phpunit:
    name: PHPUnit contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist --quiet
      - run: composer test

  repository-contract:
    name: Repository contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate Composer configuration
        run: composer validate --strict --no-check-lock
      - name: Verify required files and identifiers
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md LICENSE.md CHANGELOG.md MANIFEST.md .distignore
            composer.json phpunit.xml.dist phpstan.neon.dist phpcs.xml.dist
            sabri-universal-post-composer.php
            assets/css/create-surface.css
            includes/contracts/interface-adapter.php
            includes/contracts/interface-workflow-adapter.php
            includes/contracts/interface-diagnostic-adapter.php
            includes/core/class-permission-resolver.php
            includes/core/class-page-resolver.php
            includes/core/class-safe-mode.php
            includes/core/class-plugin.php
            includes/core/class-registry.php
            includes/core/functions.php
            includes/presentation/class-create-surface.php
            includes/integration/class-shell-bridge.php
            includes/integration/class-core-adapter-requirements.php
            tests/CreateSurfaceTest.php
            tests/AccessibilityContrastTest.php
            docs/ARCHITECTURE.md docs/ADAPTER-CONTRACT.md docs/DECISION-LOG.md docs/SECURITY.md
            docs/PRIVACY.md docs/ACCESSIBILITY.md docs/MIGRATION.md docs/ROLLBACK.md
            docs/STAGING-ACCEPTANCE.md docs/COMPATIBILITY-MATRIX.md docs/ERROR-CODES.md
            docs/FILE21-INTEGRATION.md docs/MASTER-PLAN-AMENDMENT-v2.1.md
            docs/POST-IMPLEMENTATION-REVIEW-2026-07-29.md
            docs/PHASE-22C-CREATE-SURFACE.md
            docs/PHASE-22C-POST-IMPLEMENTATION-REVIEW-2026-07-29.md
            docs/PHASE-22C-SECOND-REVIEW-CORRECTIONS-2026-07-29.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file" >&2; exit 1; }
          done
          grep -q 'Plugin Name: Sabri Universal Post Composer' sabri-universal-post-composer.php
          grep -q "define( 'SUPC_ADAPTER_API_VERSION'" sabri-universal-post-composer.php
          grep -q 'One canonical native record' README.md
          grep -q 'social_publication' docs/FILE21-INTEGRATION.md
          grep -q 'Post-Implementation Review' docs/POST-IMPLEMENTATION-REVIEW-2026-07-29.md
          grep -q 'File 23' docs/MASTER-PLAN-AMENDMENT-v2.1.md
          grep -q 'validate_internal_route' includes/presentation/class-create-surface.php
          grep -q 'invalid_privacy' includes/presentation/class-create-surface.php
          grep -q 'create_surface_diagnostics' includes/presentation/class-create-surface.php
          grep -q 'One gateway, one native record.' includes/presentation/class-create-surface.php
          grep -q 'background: var(--supc-orange-dark);' assets/css/create-surface.css
          grep -q 'prefers-reduced-motion' assets/css/create-surface.css
          grep -q 'forced-colors' assets/css/create-surface.css
          grep -q 'Phase 22C Post-Implementation Review' docs/PHASE-22C-POST-IMPLEMENTATION-REVIEW-2026-07-29.md
          grep -q 'Second Review Corrections' docs/PHASE-22C-SECOND-REVIEW-CORRECTIONS-2026-07-29.md
          grep -q 'includes/presentation/class-create-surface.php' MANIFEST.md
