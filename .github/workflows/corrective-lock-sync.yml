name: File 22 Corrective Lock Sync

on:
  push:
    branches:
      - fix/file22-cumulative-post-merge-corrections
    paths:
      - composer.json
      - .github/workflows/corrective-lock-sync.yml

permissions:
  contents: write

concurrency:
  group: file22-corrective-lock-sync
  cancel-in-progress: false

jobs:
  sync-lock:
    if: github.repository == 'majidhussainqadri1-dot/sabri-universal-post-composer' && github.actor == 'majidhussainqadri1-dot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact corrective branch head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/file22-cumulative-post-merge-corrections
          fetch-depth: 0
      - name: Refuse any other branch
        run: test "$(git branch --show-current)" = 'fix/file22-cumulative-post-merge-corrections'
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Resolve exact dependency lock
        run: composer update --no-install --no-interaction --no-progress --prefer-dist
      - name: Validate and checksum lock
        run: |
          set -euo pipefail
          composer validate --strict
          test -s composer.lock
          sha256sum composer.lock | tee composer-lock.sha256
      - name: Commit lock only when changed
        env:
          BRANCH: fix/file22-cumulative-post-merge-corrections
        run: |
          set -euo pipefail
          if git diff --quiet -- composer.lock && git ls-files --error-unmatch composer.lock >/dev/null 2>&1; then
            echo 'composer.lock is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'Lock File 22 development dependencies'
          git push origin "HEAD:${BRANCH}"
