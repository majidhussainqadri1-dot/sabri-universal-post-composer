name: File 22 Eight-Pass R5 Corrective Worker

on:
  push:
    branches:
      - feat/file22-core-composer-0.2.0-2026-08-02
    paths:
      - 'tools/file22-r5-round-*.patch'
      - '.github/workflows/file22-eight-pass-r5.yml'

permissions:
  contents: write

concurrency:
  group: file22-eight-pass-r5-worker
  cancel-in-progress: false

jobs:
  apply-eight-reviewed-corrections:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/file22-core-composer-0.2.0-2026-08-02
          fetch-depth: 0

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --quiet

      - name: Apply eight independent review-fix-test cycles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for round in 1 2 3 4 5 6 7 8; do
            patch="tools/file22-r5-round-${round}.patch"
            git apply --check "$patch"
            git apply "$patch"

            find includes -type f -name '*.php' -print0 | xargs -0 -n1 php -l
            php -l tests/ReconciliationOutboxTest.php
            composer test
            git diff --check

            case "$round" in
              1) description='CAS-guard native dispatch transitions' ;;
              2) description='prevent terminal submission downgrade' ;;
              3) description='make acknowledgement and outbox completion transactional' ;;
              4) description='recover abandoned processing leases' ;;
              5) description='preserve active leases and governed backoff' ;;
              6) description='CAS-guard retry scheduling' ;;
              7) description='bind cross-store identity and monotonic status' ;;
              8) description='bound terminal metadata retention' ;;
            esac

            if [ "$round" = '8' ]; then
              composer phpstan
              composer phpcs
              node --check assets/js/workflow-composer.js
              git rm .github/workflows/file22-eight-pass-r5.yml tools/file22-r5-round-*.patch
            fi

            git add -A
            git commit -m "File 22 R5 pass ${round}/8: ${description}"
          done

          git push origin HEAD:feat/file22-core-composer-0.2.0-2026-08-02
