name: Phase 22E Review Evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase-22e-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: Review and verification record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Phase 22E review records
        shell: bash
        run: |
          set -euo pipefail
          review='docs/PHASE-22E-POST-IMPLEMENTATION-REVIEW-2026-07-29.md'
          verification='docs/PHASE-22E-POST-CORRECTION-VERIFICATION-2026-07-29.md'
          test -f "$review"
          test -f "$verification"
          grep -q 'Phase 22E Post-Implementation Review' "$review"
          grep -q 'Phase 22E Post-Correction Verification' "$verification"
          grep -q "$review" MANIFEST.md
          grep -q "$verification" MANIFEST.md
          grep -q 'REQUEST CHANGES' "$review"
          grep -q 'No additional known code-level blocker' "$verification"
