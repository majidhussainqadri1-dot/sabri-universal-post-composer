name: Phase 22E Review Evidence

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: phase-22e-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-evidence:
    name: Historical Phase 22E evidence integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete review history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify historical evidence and supersession boundary
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          corrections='docs/PHASE-22E-SECOND-REVIEW-CORRECTIONS-2026-07-29.md'
          verification='docs/PHASE-22E-SECOND-POST-CORRECTION-VERIFICATION-2026-07-29.md'
          cumulative_merge_sha='6d965f1bd2ebcf481f4561f2fe37086cecee04f8'

          test -f "$corrections"
          test -f "$verification"
          grep -Fq -- "- \`$corrections\`" MANIFEST.md
          grep -Fq -- "- \`$verification\`" MANIFEST.md

          reviewed_sha="$(sed -n 's/^reviewed_implementation_sha: `\([0-9a-f]\{40\}\)`$/\1/p' "$verification")"
          ci_run_id="$(sed -n 's/^ci_run_id: `\([0-9][0-9]*\)`$/\1/p' "$verification")"
          ci_run_number="$(sed -n 's/^ci_run_number: `\([0-9][0-9]*\)`$/\1/p' "$verification")"

          test -n "$reviewed_sha"
          test -n "$ci_run_id"
          test -n "$ci_run_number"
          git cat-file -e "${reviewed_sha}^{commit}"
          git merge-base --is-ancestor "$reviewed_sha" HEAD

          api_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}"
          response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api_url")"

          test "$(jq -r '.name' <<<"$response")" = 'File 22 CI'
          test "$(jq -r '.head_sha' <<<"$response")" = "$reviewed_sha"
          test "$(jq -r '.run_number' <<<"$response")" = "$ci_run_number"
          test "$(jq -r '.status' <<<"$response")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$response")" = 'success'

          grep -Fq "$reviewed_sha" "$corrections"
          grep -Fq "run \`$ci_run_number\`" "$corrections"
          grep -Fq "\`$ci_run_id\`" "$corrections"

          # PR #6 merged the cumulative corrective runtime and formally superseded
          # Phase 22E as the current approval boundary. Descendants must preserve
          # the historical records, but must not fail merely because later runtime
          # files changed under a new independent review.
          git cat-file -e "${cumulative_merge_sha}^{commit}"
          if git merge-base --is-ancestor "$cumulative_merge_sha" HEAD; then
            echo 'Phase 22E evidence remains valid historical evidence and is superseded by the merged cumulative corrective baseline.'
            exit 0
          fi

          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              .github/workflows/phase22e-review-evidence.yml|\
              MANIFEST.md|\
              docs/ADAPTER-CONTRACT.md|\
              docs/ERROR-CODES.md|\
              docs/PHASE-22E-WORKFLOW-ORCHESTRATION.md|\
              docs/PHASE-22E-SECOND-REVIEW-CORRECTIONS-2026-07-29.md|\
              docs/PHASE-22E-SECOND-POST-CORRECTION-VERIFICATION-2026-07-29.md|\
              docs/SECURITY.md)
                ;;
              *)
                echo "Runtime or unapproved file changed after reviewed Phase 22E implementation SHA: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$reviewed_sha"..HEAD)
