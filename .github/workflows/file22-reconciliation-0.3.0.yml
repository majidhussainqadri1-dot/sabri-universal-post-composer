name: File 22 Reconciliation 1.0.0-rc.1 R8

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: file22-reconciliation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-package:
    name: Verify, review, and package 1.0.0-rc.1 R8
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --quiet

      - name: Run official QA
        run: |
          set -euo pipefail
          composer lint
          composer test
          composer phpstan
          composer phpcs
          node --check assets/js/workflow-composer.js
          git diff --check

      - name: Verify governing reconciliation contracts
        run: |
          set -euo pipefail
          grep -F 'Version:     1.0.0-rc.1' sabri-universal-post-composer.php
          grep -F "SUPC_VERSION', '1.0.0-rc.1" sabri-universal-post-composer.php
          grep -F "SUPC_SCHEMA_VERSION', '1.0.0" sabri-universal-post-composer.php
          grep -F "SUPC_REST_API_VERSION', '1.2.0" sabri-universal-post-composer.php
          grep -F "SUPC_PLAN_CONTRACT_VERSION', '1.0.0" sabri-universal-post-composer.php
          grep -F "SUPC_MIN_SMC_VERSION', '1.2.3" sabri-universal-post-composer.php
          grep -F "SABRI_HNF_PACKAGE_VERSION" includes/core/class-browser-runtime.php
          grep -F "wordpress_package_at_least( \$value, '1.0.3.2' )" includes/core/class-browser-runtime.php
          grep -F "file21_package_identity_missing" includes/core/class-browser-runtime.php
          grep -F "file21_package_identity_invalid" includes/core/class-browser-runtime.php
          grep -F "file21_package_identity_too_low" includes/core/class-browser-runtime.php
          ! grep -F "file21_package_identity_unknown" includes/core/class-browser-runtime.php
          grep -F "'supc_submissions'" includes/core/class-submission-store.php
          grep -F "'supc_outbox'" includes/core/class-submission-store.php
          grep -F 'MAX_ATTEMPTS            = 5' includes/core/class-submission-store.php
          grep -F 'array( 60, 300, 1800, 7200, 43200 )' includes/core/class-submission-store.php
          grep -F 'ORDINARY_TTL        = 15552000' includes/core/class-session-store.php
          grep -F 'SENSITIVE_TTL       = 2592000' includes/core/class-session-store.php
          grep -F "'reconcile'" includes/http/class-reconciliation-rest-controller.php
          grep -F "run('reconcile')" assets/js/workflow-composer.js
          test "$(grep -F -c "run('submit')" assets/js/workflow-composer.js)" -eq 1
          ! grep -E 'localStorage|sessionStorage|indexedDB' assets/js/workflow-composer.js
          ! grep -E '^\s*(payload_json|body|content|patient|consent|media_bytes)\s+(longtext|text|json|blob)' includes/core/class-submission-store.php
          test "$(grep -F -c '| 40 |' docs/FILE22-FORTY-PASS-REVIEW-R7-2026-08-03.md)" -eq 1
          test -s docs/FILE21-PACKAGE-IDENTITY-CORRECTION-R8-2026-08-03.md

      - name: Build deterministic exact-head candidate
        shell: bash
        run: |
          set -euo pipefail
          package='22-sabri-universal-post-composer-1.0.0-rc.1-FILE21-PACKAGE-IDENTITY-R8'
          stage="$RUNNER_TEMP/file22-stage"
          extract="$RUNNER_TEMP/file22-extract"
          root="$stage/sabri-universal-post-composer"
          rm -rf "$stage" "$extract" release
          mkdir -p "$root" "$extract" release
          rsync -a --delete --exclude-from=.distignore ./ "$root/"
          find "$root" -type l -print -quit | grep -q . && { echo 'Symlink found'; exit 1; } || true
          find "$root" -type f \( -name '*.log' -o -name '*.zip' -o -name '.env' \) -print -quit | grep -q . && { echo 'Forbidden file found'; exit 1; } || true
          (
            cd "$root"
            find . -type f ! -name 'MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
            awk 'NF < 2 || $1 !~ /^[0-9a-f]{64}$/ { exit 1 }' MANIFEST.sha256
          )
          cp "$root/MANIFEST.sha256" "release/${package}-MANIFEST.sha256"
          (
            cd "$stage"
            find sabri-universal-post-composer -exec touch -h -t 202608030000.00 {} +
            zip -X -9 -r "$GITHUB_WORKSPACE/release/${package}.zip" sabri-universal-post-composer >/dev/null
          )
          (cd release && sha256sum "${package}.zip" > "${package}.sha256")
          unzip -q "release/${package}.zip" -d "$extract"
          (cd "$extract/sabri-universal-post-composer" && sha256sum -c MANIFEST.sha256)
          unzip -t "release/${package}.zip"
          unzip -p "release/${package}.zip" 'sabri-universal-post-composer/sabri-universal-post-composer.php' | grep -F 'Version:     1.0.0-rc.1'
          unzip -l "release/${package}.zip" | grep -F 'sabri-universal-post-composer/includes/core/class-submission-store.php'
          unzip -l "release/${package}.zip" | grep -F 'sabri-universal-post-composer/includes/core/class-reconciliation-service.php'
          unzip -l "release/${package}.zip" | grep -F 'sabri-universal-post-composer/docs/FILE22-FORTY-PASS-REVIEW-R7-2026-08-03.md'
          unzip -l "release/${package}.zip" | grep -F 'sabri-universal-post-composer/docs/FILE21-PACKAGE-IDENTITY-CORRECTION-R8-2026-08-03.md'
          unzip -l "release/${package}.zip" | grep -F 'sabri-universal-post-composer/MANIFEST.sha256'
          ! unzip -l "release/${package}.zip" | grep -E '/(tests|vendor|\.github|_apply)/'
          cat > "release/${package}-TEST-REPORT.md" <<REPORT
          # File 22 1.0.0-rc.1 File 21 Package Identity R8 Candidate

          - Exact source head: ${EXPECTED_SHA}
          - Forty sequential review/correction records: PASS
          - File 21 package identity 1.0.3.2 regression: PASS
          - Runtime/API SemVer and package identity separation: PASS
          - Missing/invalid/too-low diagnostics: PASS
          - Official PHPUnit: PASS
          - PHPStan: PASS
          - WordPress Coding Standards: PASS
          - JavaScript syntax: PASS
          - Submission identity map: PRESENT
          - Reconciliation outbox: PRESENT
          - Payload-bound idempotency: PRESENT
          - Request-time reconciliation: PRESENT
          - Five-attempt dead-letter policy: PRESENT
          - Embedded MANIFEST.sha256: PASS
          - External archive SHA-256: PASS
          - File 00 minimum: plugin 1.2.3 / DB 1.2.0 / contract 1.1.2
          - File 21 required package identity for integrated staging: 1.0.3.2
          - File 21 stable runtime/API: 1.0.3
          - Staging accepted: 0
          - Live deployed: 0
          - Operational: 0
          REPORT

      - name: Upload candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file22-1.0.0-rc.1-file21-package-identity-r8-${{ env.EXPECTED_SHA }}
          retention-days: 30
          if-no-files-found: error
          path: |
            release/22-sabri-universal-post-composer-1.0.0-rc.1-FILE21-PACKAGE-IDENTITY-R8.zip
            release/22-sabri-universal-post-composer-1.0.0-rc.1-FILE21-PACKAGE-IDENTITY-R8.sha256
            release/22-sabri-universal-post-composer-1.0.0-rc.1-FILE21-PACKAGE-IDENTITY-R8-MANIFEST.sha256
            release/22-sabri-universal-post-composer-1.0.0-rc.1-FILE21-PACKAGE-IDENTITY-R8-TEST-REPORT.md
