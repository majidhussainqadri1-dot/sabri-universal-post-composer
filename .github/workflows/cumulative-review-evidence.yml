name: File 22 Cumulative Review Evidence

on:
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: file-22-cumulative-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cumulative-evidence:
    name: Exact runtime and cross-repository evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete cumulative history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify cumulative correction evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          verification='docs/FILE22-CUMULATIVE-POST-CORRECTION-VERIFICATION-2026-07-30.md'
          test -f "$verification"
          grep -Fq -- "- \`$verification\`" MANIFEST.md
          grep -Fq -- '- `.github/workflows/cumulative-review-evidence.yml`' MANIFEST.md

          reviewed_sha="$(sed -n 's/^reviewed_implementation_sha: `\([0-9a-f]\{40\}\)`$/\1/p' "$verification")"
          ci_run_id="$(sed -n 's/^ci_run_id: `\([0-9][0-9]*\)`$/\1/p' "$verification")"
          ci_run_number="$(sed -n 's/^ci_run_number: `\([0-9][0-9]*\)`$/\1/p' "$verification")"
          lock_sha="$(sed -n 's/^composer_lock_sha256: `\([0-9a-f]\{64\}\)`$/\1/p' "$verification")"
          file21_sha="$(sed -n 's/^file21_verified_sha: `\([0-9a-f]\{40\}\)`$/\1/p' "$verification")"
          file21_run_id="$(sed -n 's/^file21_contract_run_id: `\([0-9][0-9]*\)`$/\1/p' "$verification")"
          file21_run_number="$(sed -n 's/^file21_contract_run_number: `\([0-9][0-9]*\)`$/\1/p' "$verification")"

          test -n "$reviewed_sha"
          test -n "$ci_run_id"
          test -n "$ci_run_number"
          test -n "$lock_sha"
          test -n "$file21_sha"
          test -n "$file21_run_id"
          test -n "$file21_run_number"
          git cat-file -e "${reviewed_sha}^{commit}"
          git merge-base --is-ancestor "$reviewed_sha" HEAD
          test "$(sha256sum composer.lock | awk '{print $1}')" = "$lock_sha"

          file22_response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run_id}")"
          test "$(jq -r '.name' <<<"$file22_response")" = 'File 22 CI'
          test "$(jq -r '.head_sha' <<<"$file22_response")" = "$reviewed_sha"
          test "$(jq -r '.run_number' <<<"$file22_response")" = "$ci_run_number"
          test "$(jq -r '.status' <<<"$file22_response")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$file22_response")" = 'success'

          file21_response="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/majidhussainqadri1-dot/sabri-complete-home-news-feed/actions/runs/${file21_run_id}")"
          test "$(jq -r '.name' <<<"$file21_response")" = 'File 21 File 22 Real Contract'
          test "$(jq -r '.head_sha' <<<"$file21_response")" = "$file21_sha"
          test "$(jq -r '.run_number' <<<"$file21_response")" = "$file21_run_number"
          test "$(jq -r '.status' <<<"$file21_response")" = 'completed'
          test "$(jq -r '.conclusion' <<<"$file21_response")" = 'success'

          grep -Fq "$reviewed_sha" "$verification"
          grep -Fq "$file21_sha" "$verification"

          if [ "$HEAD_BRANCH" != 'fix/file22-cumulative-post-merge-corrections' ]; then
            echo 'Cumulative evidence is historical on this branch; the corrective-branch file freeze does not apply.'
            exit 0
          fi

          while IFS= read -r file; do
            test -z "$file" && continue
            case "$file" in
              .github/workflows/ci.yml|\
              .github/workflows/cumulative-review-evidence.yml|\
              MANIFEST.md|\
              docs/FILE22-CUMULATIVE-POST-CORRECTION-VERIFICATION-2026-07-30.md)
                ;;
              *)
                echo "Runtime or unapproved file changed after reviewed cumulative implementation SHA: $file" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$reviewed_sha"..HEAD)
