name: File 22 Eighth Complete Review Evidence

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: file-22-eighth-review-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  eighth-review-evidence:
    name: Exact-head eighth review regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SHA }}
      - name: Verify exact source head
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - name: Set up PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2.37.1
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Install locked development dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --quiet
      - name: Run cumulative PHPUnit suite
        run: composer test
      - name: Verify canonical Membership Core rejection boundary
        run: php tests/run-untrusted-membership-core-test.php
      - name: Verify managed-page rollback and quarantine contract
        run: php tests/run-managed-page-rollback-test.php
      - name: Verify bootstrap and API global-scope isolation
        run: php tests/run-global-scope-isolation-test.php
      - name: Verify eighth review inventory
        shell: bash
        run: |
          set -euo pipefail
          required=(
            includes/core/class-version.php
            tests/EighthCompleteReviewTest.php
            tests/fixtures/sabri-membership-core/sabri-membership-core.php
            tests/fixtures/sabri-membership-core/includes/functions.php
            docs/FILE22-EIGHTH-COMPLETE-REPOSITORY-REVIEW-AND-CORRECTION-2026-07-31.md
          )
          for file in "${required[@]}"; do
            test -f "$file"
            grep -Fq -- "- \`$file\`" MANIFEST.md
          done
          grep -Fq 'compare_prerelease' includes/core/class-version.php
          grep -Fq "CORE_DIRECTORY  = 'sabri-membership-core'" includes/core/class-permission-resolver.php
          grep -Fq "SMC_DB_VERSION" includes/core/class-permission-resolver.php
          grep -Fq 'supc_created_page_cleanup_failed' includes/core/class-page-resolver.php
          grep -Fq 'Eighth complete-repository hardening' CHANGELOG.md
